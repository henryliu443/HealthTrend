# JVM: Gradle runs on the JDK pointed to by org.gradle.java.home in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.9.0 was tested only up to compileSdk 35; spec pins compileSdk 36.
# This suppresses the (harmless) compatibility warning. Revisit if AGP is upgraded.
android.suppressUnsupportedCompileSdk=36

# Kotlin
kotlin.code.style=official
